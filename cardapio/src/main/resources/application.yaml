spring:
  application:
    name: cardapio
  datasource:
    url: jdbc:h2:mem:cardapiodb
    driver-class-name: org.h2.Driver
    username: sa
    password: teste
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  mvc:
    apiversion:
      use:
        header: Api-Version

server:
  port: 8081
springdoc:
  swagger-ui:
    path: /swagger-ui.html
