spring:
  application:
    name: cardapio
  datasource:
    url: jdbc:h2:mem:cardapiodb
    driver-class-name: org.h2.Driver
    username: cantinaja
    password: cantinaja123
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  mvc:
    apiversion:
      use:
        path-segment: 1
      default: "v1"

server:
  port: 8081

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
