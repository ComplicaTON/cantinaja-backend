spring:
  application:
    name: carteira
  datasource:
    url: jdbc:h2:mem:carteiradb
    driver-class-name: org.h2.Driver
    username: cantinaja
    password: cantinaja123
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  mvc:
    apiversion:
      use:
        header: version
      default: v1

server:
  port: 8082
springdoc:
  swagger-ui:
    path: /swagger-ui.html
